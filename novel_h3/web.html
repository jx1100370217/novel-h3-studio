<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视制片工作台 · 多项目平台</title>
<style>
:root{

}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px),radial-gradient(circle at 72% -10%,#1c2b24 0,transparent 34rem),radial-gradient(circle at 0 100%,#142019 0,transparent 38rem),linear-gradient(180deg,#0a100d,#080d0b);background-size:48px 48px,48px 48px,auto,auto,auto;background-attachment:fixed;color:var(--text);font:14px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 15px;background:var(--surface-3);color:inherit;transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}
button:hover{border-color:var(--gold);background:#25362d;box-shadow:0 8px 24px #0004;transform:translateY(-1px)}

a{color:var(--gold-soft);text-decoration:none}

header{position:sticky;top:0;z-index:20;padding:17px 34px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:24px;background:#0b110fd9;backdrop-filter:blur(18px)}
.brand-lockup{display:flex;align-items:center;gap:14px;min-width:0}

.brand-subtitle{color:var(--muted);font-size:13px;letter-spacing:1px;font-weight:450;margin-left:6px}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.project-switcher{display:flex;align-items:center;gap:7px;padding:3px 5px 3px 10px;border:1px solid var(--line);border-radius:11px;background:#101914}.project-label{color:#789087;font-size:11px;white-space:nowrap}.project-picker{min-width:145px;border:0;background:transparent;padding:5px 25px 5px 3px;color:var(--gold-soft);font-size:12px;outline:none}.project-picker:focus{box-shadow:none}

.nav-group{margin:0 0 20px}
.nav-group-title{padding:0 12px;margin:0 0 7px;color:#6f8177;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700}

main{padding:38px clamp(22px,4vw,62px) 60px;min-width:0;max-width:1600px;width:100%}
main>h2{font-size:29px;font-weight:580;letter-spacing:1px;margin:0 0 22px}

p{margin:8px 0}
.dashboard-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:26px 28px;margin:0 0 24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#17231d,#101713 65%);box-shadow:var(--shadow);position:relative;overflow:hidden}
.dashboard-hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-150px;border:1px solid #d9ae6738;box-shadow:0 0 0 18px #d9ae6710,0 0 0 38px #d9ae6708}
.eyebrow{color:var(--gold);font-size:10px;letter-spacing:3px;font-weight:750;margin-bottom:7px}
.dashboard-hero h3{font-size:25px;letter-spacing:.5px;margin-bottom:4px}
.hero-copy{max-width:660px;color:var(--muted);margin:0}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}
.hero-pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:#b7c9bd;background:#0d1511aa;font-size:11px;white-space:nowrap}
.lead{font-size:30px;letter-spacing:2px;line-height:1.4}.muted{color:var(--muted)}
.warn{border-left:3px solid var(--gold);padding:12px 18px;background:#2b271d;color:#ead4ae;border-radius:0 9px 9px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.card{background:linear-gradient(145deg,#17211c,#111814);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 10px 28px #00000018}
.card:hover{border-color:#507261}
.stat{font-size:32px;color:var(--gold);font-weight:600;letter-spacing:.5px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.step{padding:18px;border-top:1px solid var(--line)}.step b{display:block;font-size:16px}.step span{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
img,video{display:block;width:100%;border-radius:10px;background:#050806}audio{width:100%}
input,textarea,select{border:1px solid var(--line);border-radius:9px;background:#0d1410;color:inherit;padding:9px 12px}textarea{width:100%;min-height:90px}
table{width:100%;border-collapse:collapse}td,th{padding:11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:400;font-size:13px}.tablebox{max-height:62vh;overflow:auto}
details{margin:10px 0}summary{cursor:pointer;color:var(--gold-soft)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,monospace;max-height:55vh;overflow:auto}
.jump-target{outline:2px solid var(--gold);box-shadow:0 0 0 5px #deba7940;border-radius:12px;transition:box-shadow .2s}label{display:inline-flex;align-items:center;gap:7px;margin:7px 12px 7px 0}
.message{position:fixed;bottom:20px;right:24px;max-width:560px;border:1px solid var(--gold);background:#27362d;padding:16px 22px;border-radius:12px;white-space:pre-wrap;z-index:50;box-shadow:var(--shadow)}
.workflow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.workflow-step{position:relative;min-height:176px;padding-left:62px}.workflow-step .step-index{position:absolute;left:20px;top:20px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#26382d;border:1px solid var(--line-strong);color:var(--gold);font-weight:700}.workflow-step.done{border-color:#507f65}.workflow-step.in_progress{border-color:var(--line-strong)}.workflow-step.pending{opacity:.78}.workflow-step .step-status{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);font-size:11px}.workflow-step.done .step-status{color:var(--green);border-color:#507f65}.workflow-step.in_progress .step-status{color:var(--gold-soft);border-color:var(--line-strong)}.workflow-step progress{margin:12px 0 2px}.workflow-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.workflow-summary .card{margin:0}.create-project-copy{color:var(--muted);margin:0 0 18px}.create-project-form{display:grid;gap:12px}.create-project-form label{display:grid;gap:5px;margin:0;color:var(--muted)}.create-project-form input{width:100%}
#liveProgress{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(290px,.58fr);gap:18px;align-items:start}
#liveProgress>.prep-card{grid-column:1/-1}
#liveProgress>.video-card{grid-column:1}
#liveProgress>.rework-card{grid-column:2}
#liveProgress>.book-kpis{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:2px}
#liveProgress>.lead{grid-column:1/-1;margin:4px 0 0;color:var(--gold-soft)}
#liveProgress>.progress-stats{grid-column:1/-1;grid-template-columns:repeat(5,minmax(0,1fr))}
#liveProgress>.dashboard-progress{grid-column:1/-1;margin:0 0 3px}
#liveProgress>.recent-shots{grid-column:1/-1}
#liveProgress>.prep-card>.grid{grid-template-columns:repeat(6,minmax(0,1fr))}
#liveProgress>.card{min-width:0}
#liveProgress>.card h3{display:flex;align-items:center;gap:9px;letter-spacing:.04em}
#liveProgress>.card h3:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex:none}
#liveProgress>.video-card{background:linear-gradient(145deg,#172920,#102019);border-color:#4a8064}
#liveProgress>.rework-card{background:linear-gradient(145deg,#28231a,#161a15);border-color:#866d42}
#liveProgress>.book-kpis .card{margin:0;background:#101713;border-color:var(--line)}
#liveProgress>.progress-stats .card{margin:0;background:linear-gradient(145deg,#19271f,#111814);border-top:2px solid #4f7f65}
#liveProgress>.progress-stats .card:nth-child(4){border-top-color:#8a6750}
#liveProgress>.progress-stats .card:nth-child(5){border-top-color:#8c6b4e}
#liveProgress>.recent-shots p{padding:10px 0;margin:0;border-bottom:1px solid var(--line)}
#liveProgress>.recent-shots p:last-child{border-bottom:0}
#liveProgress>.dashboard-progress{height:9px;filter:drop-shadow(0 0 7px #d9ae6766)}
@keyframes statusPulse{0%,100%{opacity:.72;box-shadow:0 0 0 5px #91d3b41f,0 0 12px var(--green)}50%{opacity:1;box-shadow:0 0 0 7px #91d3b414,0 0 21px var(--green)}}
.status-dot{animation:statusPulse 2.4s ease-in-out infinite}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:26px 0}.hero img{aspect-ratio:16/9;object-fit:cover}progress{width:100%;accent-color:var(--gold);height:7px}.error{color:var(--danger)}.empty{border:1px dashed var(--line);padding:30px;color:var(--muted);border-radius:10px}
dialog{max-width:900px;width:90%;background:var(--surface);border:1px solid var(--line-strong);border-radius:15px;color:inherit;box-shadow:var(--shadow)}dialog::backdrop{background:#000b}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#liveProgress{grid-template-columns:1fr}#liveProgress>.video-card,#liveProgress>.rework-card{grid-column:1}.dashboard-hero{align-items:flex-start;flex-direction:column}.hero-pills{justify-content:flex-start}.hero,.two{grid-template-columns:1fr}.layout{grid-template-columns:196px 1fr}}
@media(max-width:700px){header{padding:14px 16px;align-items:flex-start}.project-switcher{order:3;width:100%;justify-content:space-between}.project-picker{flex:1;min-width:0}.brand-mark{width:36px;height:36px;border-radius:11px}header small{font-size:8px;letter-spacing:2px}h1{font-size:18px;letter-spacing:2px}.brand-subtitle{font-size:11px}.header-actions{gap:6px}.header-status{display:none}.header-actions .tag{font-size:10px}.header-actions button{padding:7px 9px}.layout{display:block}.layout nav{position:sticky;top:67px;height:auto;display:flex;gap:5px;overflow-x:auto;padding:8px 10px;z-index:10}.nav-group{display:flex;gap:4px;margin:0}.nav-group-title,.nav-footer-label,nav p{display:none}nav button{white-space:nowrap;width:auto;margin:0;padding:7px 11px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}main{padding:23px 15px 45px}main>h2{font-size:24px}.dashboard-hero{padding:21px}.dashboard-hero h3{font-size:22px}.lead{font-size:25px}#liveProgress>.prep-card>.grid,#liveProgress>.progress-stats,#liveProgress>.book-kpis{grid-template-columns:1fr}.card{padding:17px}}
</style>
<header><div class="brand-lockup"><div class="brand-mark">N→C</div><div><small>STORY PRODUCTION OS · LOCAL PIPELINE</small><h1>影视制片工作台 <span class="brand-subtitle">多项目生产平台</span></h1></div></div><div class="header-actions"><div class="project-switcher"><span class="project-label">当前项目</span><select id="projectPicker" class="project-picker" aria-label="切换项目"></select></div><div class="header-status"><i class="status-dot"></i><span>本地制片链路</span></div><span class="tag">16:9 · 24 fps</span><span class="tag" id="engineLabel"></span><button id="newProject" class="primary">新建项目</button><button id="refresh">刷新进度</button></div></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dialog"><div class="row spread"><h3 id="dialogTitle"></h3><button id="closeDialog">关闭</button></div><pre id="dialogBody"></pre><div id="dialogActions" class="row"></div><button id="copyDialog" class="primary">复制到 Codex</button></dialog>
<dialog id="createProjectDialog"><div class="row spread"><h3>创建小说项目</h3><button id="closeCreateProject">关闭</button></div><p class="create-project-copy">上传 TXT 原文后，工作台会创建独立项目并保存原文；进入项目向导后，再按需生成逐章分析工作单，逐步完成剧本、资产、镜头和成片。</p><div class="create-project-form"><label>小说名称<input id="createProjectTitle" placeholder="例如：星海归途" required></label><label>作者（可选）<input id="createProjectAuthor" placeholder="未填写作者"></label><label>项目标识（可选，仅英文、数字、下划线或连字符）<input id="createProjectId" placeholder="留空自动生成"></label><label>小说原文（TXT）<input id="createProjectFile" type="file" accept=".txt,text/plain" required></label><p id="createProjectError" class="error"></p><div class="row"><button id="createProjectSubmit" class="primary">创建并进入项目向导</button><button id="createProjectCancel">取消</button></div></div></dialog>
<dialog id="renameProjectDialog"><div class="row spread"><h3>重命名项目</h3><button id="closeRenameProject">关闭</button></div><div class="create-project-form"><label>项目名称<input id="renameProjectTitle" required></label><label>作者（可选）<input id="renameProjectAuthor"></label><p class="muted">页面只把“项目名称”作为项目名显示；作者单独保存，不会再混入项目名称。</p><p id="renameProjectError" class="error"></p><div class="row"><button id="renameProjectSubmit" class="primary">保存名称</button><button id="renameProjectCancel">取消</button></div></div></dialog>
<script>
let data,projects=[],view='progress',audioSnapshot='',pendingAssetTarget=null,workflowData=null;const $=x=>document.getElementById(x);const pages={progress:'任务总览',guide:'项目向导',overview:'制作总览',preparation:'章节资料与补充',source:'原文与完整性',assets:'角色·场景·道具',content:'内容规划与锁定',episodes:'导演分镜',execution:'镜头执行单',images:'图片工作单',review:'看片与验收',audio:'音频审片',delivery:'分集与长片交付'};const states={submitting:'提交待核实',submitted:'生成中',rendered:'待审片',approved:'已验收',rejected:'需重拍',failed:'生成或检查失败',canceled:'已停止',stale:'前序变化，需重拍'};function audioMark(t){return t.lip_sync_gate?.status==='blocked'?' · 音画同步门禁拦截':t.audio_cleanup==='applied'?' · 已清理对白外音频':''}
function displayTitle(value){return String(value??'').replace(/\s*[·•]\s*无旁白新版\s*/g,'').replace(/\s*无旁白新版\s*/g,'').replace(/\s*新版\s*/g,'').trim()}function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function append(parent,...children){children.filter(Boolean).forEach(c=>parent.append(c));return parent}function button(text,fn,cls){const e=el('button',text,cls);e.onclick=async()=>{e.disabled=true;try{await fn()}catch(x){toast(x.message)}finally{e.disabled=false}};return e}function card(title){const c=el('section',undefined,'card');if(title)c.append(el('h3',title));return c}function media(path,kind='img'){const e=el(kind);e.src='/media?path='+encodeURIComponent(path);if(kind==='video'||kind==='audio'){e.controls=true;e.preload='metadata'}return e}function toast(text){document.querySelector('.message')?.remove();const m=el('div',text,'message');document.body.append(m);setTimeout(()=>m.remove(),11000)}
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok){const e=Error(v.error||'请求失败');e.payload=v;throw e};return v}async function act(path,body){const v=await request(path,body);toast(typeof v.result==='string'?v.result:'已完成');await load();return v}function detail(title,content){const d=el('details');append(d,el('summary',title),el('pre',typeof content==='string'?content:JSON.stringify(content,null,2)));return d}function show(title,body,gate){$('dialogTitle').textContent=title;$('dialogBody').textContent=typeof body==='string'?body:JSON.stringify(body,null,2);const actions=$('dialogActions');actions.replaceChildren();const seen=new Set();if(body?.items)body.items.filter(x=>x.auto_regeneration).forEach(x=>{const meta=assetMeta(x.asset);if(!meta)return;const href=assetJump(meta);if(seen.has(href))return;seen.add(href);const link=el('a','跳转到'+meta.label+'：'+meta.name+'（自动重生成任务）');link.href=href;actions.append(link)});if(gate?.blockers?.length){gate.blockers.forEach(blocker=>{const target=gateTarget(blocker,gate.episode)||{href:'/?view=preparation&episode='+encodeURIComponent(gate.episode),label:'查看本章资料与工作单'};if(seen.has(target.href))return;seen.add(target.href);const link=el('a',target.label);link.href=target.href;actions.append(link)})} $('dialog').showModal()}
const navGroups=[['驾驶舱',['progress','guide','overview']],['前期制作',['source','preparation','content','assets','episodes','execution','images']],['生成与质检',['review','audio','delivery']]];function drawNav(){const n=$('nav');n.replaceChildren();let order=0;navGroups.forEach(([title,ids])=>{const group=el('div',undefined,'nav-group');group.append(el('div',title,'nav-group-title'));ids.filter(id=>pages[id]).forEach(id=>{const number=String(++order).padStart(2,'0');group.append(button(number+'  '+pages[id],()=>{view=id;history.pushState({},'',`/?view=${encodeURIComponent(id)}`);render()},id===view?'active':''))});n.append(group)});n.append(el('div','LIVE PIPELINE','nav-footer-label'),el('p','原文 → 剧本 → 资产 → 分镜 → 渲染 → 验收 → 交付。\n每一环都保留可追溯记录。'))}
function renderProjectPicker(){const picker=$('projectPicker');if(!picker)return;const active=data?.project_context?.id||'';picker.replaceChildren();projects.forEach(item=>{const option=el('option',item.title||item.id);option.value=item.id;option.title=(item.title||item.id)+(item.author?' · 作者：'+item.author:'');picker.append(option)});picker.value=active;picker.onchange=async()=>{const id=picker.value;if(!id)return;picker.disabled=true;try{const selected=projects.find(item=>item.id===id);await request('/api/switch-project',{project:id});await load();toast('已切换到项目：'+(selected?.title||id))}catch(error){toast(error.message);picker.value=active}finally{picker.disabled=false}}}function readRoute(){const q=new URLSearchParams(location.search);if(q.get('view')&&pages[q.get('view')])view=q.get('view');const hash=location.hash.startsWith('#asset-')?decodeURIComponent(location.hash.slice(7)):'';const asset=q.get('asset')||hash;pendingAssetTarget=asset?{bucket:q.get('bucket')||'',asset}:null}
function assetMeta(assetId){for(const [bucket,label] of Object.entries({characters:'角色',scenes:'场景',props:'道具'})){for(const [name,item] of Object.entries(data?.asset_inventory?.[bucket]||{})){if(item.id===assetId)return {bucket,label,name,item}}}return null}
function characterMeta(name){const item=data?.asset_inventory?.characters?.[name];return item?{bucket:'characters',label:'角色',name,item}:null}

function gateReason(reason){return ({script_missing:'正式剧本缺失',visual_missing:'正式分镜缺失',image_source_invalid:'图片来源核验失败',image_review_pending:'图片待审核',image_not_registered:'图片尚未登记',image_file_missing:'图片文件缺失',image_hash_changed:'图片哈希已变化',voice_review_pending:'参考音频待审听',voice_not_registered:'参考音频尚未登记',voice_file_missing:'参考音频文件缺失',voice_hash_changed:'参考音频哈希已变化',rhythm_review_pending:'节奏编排待审阅',source_sequence_unverified:'原文顺序待核对',speaker_audit_pending:'说话人核对待完成',visual_content_digest_stale:'视觉工作单需要重新编译',visual_workorder_incomplete:'分镜工作单不完整',chapter_material_missing:'章节材料缺失',comfy_queue_busy:'生成队列忙碌'}[reason]||reason||'需要处理')}
function gateTarget(blocker,episode){if(blocker.asset){const meta=assetMeta(blocker.asset);if(meta)return {href:assetJump(meta),label:'跳转到'+meta.label+'：'+meta.name}}if(blocker.speaker){const meta=characterMeta(blocker.speaker);if(meta)return {href:assetJump(meta),label:'跳转到角色音频：'+meta.name};return {href:'/?view=assets&bucket=characters',label:'打开角色参考音频页'}}const chapter=episode?'&episode='+encodeURIComponent(episode):'';const contentReasons=['rhythm_review_pending','source_sequence_unverified','speaker_audit_pending'];if(contentReasons.includes(blocker.reason))return {href:'/?view=preparation'+chapter,label:'跳转到本章资料复核'};const visualReasons=['visual_content_digest_stale','visual_workorder_incomplete'];if(visualReasons.includes(blocker.reason))return {href:'/?view=episodes'+chapter,label:'跳转到本章导演分镜'};return null}
function reviewContent(review){
 if(!review)return null;
 const box=card('本章实际复核内容');
 const rhythm=review.rhythm_review||{};const audit=review.speaker_audit||{};
 const state=(rhythm.reviewed?'已确认':'待确认')+' · 原文顺序'+(rhythm.source_sequence_verified?'已核对':'待核对')+' · 说话人'+(audit.status==='reviewed'?'已核对':'待核对');
 append(box,el('p',`本章已编排 ${review.scene_count} 个镜头，人物对白 ${review.dialogue_count} 句，计划总时长约 ${review.planned_seconds} 秒；最长单镜 ${review.max_planned_seconds} 秒。`,'muted'),el('p','复核状态：'+state,'warn'),el('p',review.audio_policy,'warn'));
 if(review.dramatic_question)box.append(el('p','戏剧问题：'+review.dramatic_question));
 if(review.turning_point)box.append(el('p','本章转折：'+review.turning_point,'muted'));
 const details=el('details');details.open=true;details.append(el('summary','展开查看每个镜头的原文、动作、运镜和对白'));
 const scroll=el('div',undefined,'tablebox');const table=el('table');const head=el('tr');['镜头 / 时长','原文依据与画面参考','动作与运镜','对白与说话人'].forEach(label=>head.append(el('th',label)));table.append(head);
 (review.rows||[]).forEach(row=>{
  const tr=el('tr');const seconds=row.actual_seconds===null||row.actual_seconds===undefined?row.duration_seconds:row.actual_seconds;
  const timing=el('td');timing.append(el('p',`${row.scene_id} · ${seconds ?? '—'} 秒`),el('p','内容目标：'+(row.duration_seconds ?? '—')+' 秒','muted'),el('p',row.continuity==='continue'?'延续上镜':'自然剪辑 / 新建场景','muted'));
  const source=el('td');source.append(el('p','原文：'+(row.source_text||'—')));if(row.visual_narration)source.append(el('p','画面参考（不发声）：'+row.visual_narration,'muted'));if(row.characters?.length)source.append(el('p','角色：'+row.characters.join('、'),'muted'));if(row.scenes?.length)source.append(el('p','场景：'+row.scenes.join('、'),'muted'));if(row.props?.length)source.append(el('p','道具：'+row.props.join('、'),'muted'));
  const motion=el('td');motion.append(el('p','动作：'+(row.action||row.scene_description||'—')));const cam=row.camera||{};motion.append(el('p','运镜：'+[cam.size,cam.lens_mm?cam.lens_mm+'mm':'',cam.movement].filter(Boolean).join(' · ')));if(cam.motivation)motion.append(el('p','动机：'+cam.motivation,'muted'));if(row.soundscape)motion.append(el('p','声音规则：'+row.soundscape,'muted'));
  const speech=el('td');if(!row.utterances?.length)speech.append(el('p','本镜无人物对白；只生成画面，不生成旁白声音。','muted'));else row.utterances.forEach(line=>{speech.append(el('p',(line.speaker||'未确认')+'：'+line.text));if(line.reason)speech.append(el('p','说话人核对依据：'+line.reason,'muted'))});
  tr.append(timing,source,motion,speech);table.append(tr);
 });scroll.append(table);details.append(scroll);box.append(details);return box;
}
function gateCard(gate){
 const blockers=Array.isArray(gate.blockers)?gate.blockers:[];const note=card('待审核 / 审听详情');note.dataset.assetGate='1';const cid=(gate.episode||'').replace(/^chapter_/,'');const chapter=data?.book?.chapters?.find(item=>item.id===cid);const chapterLabel=chapter?((gate.episode||'当前章节')+' · '+displayTitle(chapter.title)):(gate.episode||'当前章节');append(note,el('p',blockers.length?'章节 '+chapterLabel+' 尚未满足生成门禁；以下项目逐项处理后会自动复查。':'章节 '+chapterLabel+' 的资料检查已通过，当前无需处理。',blockers.length?'warn':'muted'));if(gate.review)note.append(reviewContent(gate.review));
 if(!blockers.length){return note}
 const list=el('div');blockers.forEach(blocker=>{
  const entry=el('div',undefined,'step');const meta=blocker.asset?assetMeta(blocker.asset):blocker.speaker?characterMeta(blocker.speaker):null;const voice=blocker.speaker?(data.voices||{})[blocker.speaker]:null;
  const subject=blocker.name||blocker.speaker||'需要处理';const details=[blocker.shot?'镜头 '+blocker.shot:'',gateReason(blocker.reason)];
  if(meta?.item?.source_facts)details.push('原文资产依据：'+meta.item.source_facts);
  const checked=blocker.asset&&data.state.assets?.[blocker.asset]?.precheck?.reason;if(checked&&checked!==gateReason(blocker.reason))details.push('技术预检：'+checked);
  if(voice?.identity)details.push('声音身份：'+voice.identity);if(voice?.transcript)details.push('参考音频内容：'+voice.transcript);if(blocker.details)details.push(blocker.details);
  entry.append(el('p',subject,'tag'),el('p',details.filter(Boolean).join(' · '),'muted'));
  const links=el('div',undefined,'row');const target=gateTarget(blocker,gate.episode)||{href:'/?view=preparation&episode='+encodeURIComponent(gate.episode),label:'查看本章资料与工作单'};if(target){const link=el('a',target.label);link.href=target.href;links.append(link)}
  if(blocker.speaker&&voice)links.append(rework('voice',blocker.speaker,gate.episode));if(voice?.path){const audio=el('a','播放参考音频');audio.href='/media?path='+encodeURIComponent(voice.path);audio.target='_blank';links.append(audio)}
  if(blocker.asset&&['image_not_registered','image_file_missing','image_hash_changed','image_source_invalid'].includes(blocker.reason))links.append(button('补充 / 重新生成图片任务',()=>prepareMissing(gate.episode,'image',blocker.asset)));if(['script_missing','visual_missing','chapter_material_missing','rhythm_review_pending','source_sequence_unverified','speaker_audit_pending','visual_workorder_incomplete'].includes(blocker.reason))links.append(button('生成补充工作单',()=>prepareMissing(gate.episode,'script')));if(blocker.reason==='rhythm_review_pending'){const note=el('textarea');note.placeholder='确认已核对本章完整语义、动作节奏和15秒上限后，填写复核意见';entry.append(note,button('确认节奏复核通过',async()=>{if(!note.value.trim())throw Error('请先填写节奏复核意见');await act('/api/approve-rhythm',{episode:gate.episode,note:note.value.trim()})}))}if(links.childElementCount)entry.append(links);list.append(entry)
 });note.append(list);return note
}


async function fileBase64(file){const bytes=new Uint8Array(await file.arrayBuffer());let out='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)out+=String.fromCharCode(...bytes.subarray(i,Math.min(i+chunk,bytes.length)));return btoa(out)}
async function createProject(){const error=$('createProjectError');error.textContent='';const file=$('createProjectFile').files?.[0];if(!file){error.textContent='请选择 TXT 原文';return}if(file.size>40*1024*1024){error.textContent='原文文件不能超过 40 MB';return}const button=$('createProjectSubmit');button.disabled=true;try{const result=await request('/api/create-project',{id:$('createProjectId').value.trim(),title:$('createProjectTitle').value.trim(),author:$('createProjectAuthor').value.trim(),filename:file.name,source_base64:await fileBase64(file)});$('createProjectDialog').close();workflowData=null;view='guide';await load();toast(result.result?.message||'项目已创建');}catch(e){error.textContent=e.message||'项目创建失败'}finally{button.disabled=false}}
function openRenameProject(){const project=data?.project_context||{};$('renameProjectTitle').value=project.title||'';$('renameProjectAuthor').value=project.author||'';$('renameProjectError').textContent='';$('renameProjectDialog').showModal();setTimeout(()=>$('renameProjectTitle').focus(),0)}
async function renameProject(){const title=$('renameProjectTitle').value.trim();const author=$('renameProjectAuthor').value.trim();if(!title){$('renameProjectError').textContent='项目名称不能为空';return}const submit=$('renameProjectSubmit');submit.disabled=true;try{const response=await request('/api/rename-project',{project:data.project_context.id,title,author});$('renameProjectDialog').close();workflowData=null;await load();const renamed=response.result?.project||data.project_context;toast('项目已重命名：'+(renamed.title||title))}catch(e){$('renameProjectError').textContent=e.message||'项目重命名失败'}finally{submit.disabled=false}}
async function deleteProject(){const project=data?.project_context||{};if(!project.id)return;if(!window.confirm(`确定删除项目“${project.title||project.id}”吗？\n项目原文、资产、剧本、分镜、视频和验收记录都会被删除。`))return;try{const result=await request('/api/delete-project',{project:project.id});workflowData=null;view='guide';await load();toast(result.result?.switched?'项目已删除，工作台已切换到其他项目':'项目已删除')}catch(e){toast(e.message||'项目删除失败')}}
async function load(){const [next,catalog]=await Promise.all([request('/api/status'),request('/api/projects')]);data=next;projects=catalog.projects||[];renderProjectPicker();$('engineLabel').textContent=data.video_engine.name+' · '+data.video_engine.steps+' 步';if(view==='guide')workflowData=null;render()}$('refresh').onclick=()=>load().catch(e=>toast(e.message));$('newProject').onclick=()=>{$('createProjectError').textContent='';$('createProjectDialog').showModal()};$('closeCreateProject').onclick=()=>$('createProjectDialog').close();$('createProjectCancel').onclick=()=>$('createProjectDialog').close();$('createProjectSubmit').onclick=()=>createProject();$('closeRenameProject').onclick=()=>$('renameProjectDialog').close();$('renameProjectCancel').onclick=()=>$('renameProjectDialog').close();$('renameProjectSubmit').onclick=()=>renameProject();$('closeDialog').onclick=()=>$('dialog').close();$('copyDialog').onclick=async()=>{await navigator.clipboard.writeText($('dialogBody').textContent);toast('已复制工作单')};readRoute();load().catch(e=>toast(e.message));
</script></html>
