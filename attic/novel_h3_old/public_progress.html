<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>人道无极 · 实时制作进度</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#101312;color:#f4f2e9;margin:0}main{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:28px}h2{font-size:20px}small,.muted{color:#a2aea7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#1b201e;border:1px solid #333d36;border-radius:12px;padding:20px;margin:16px 0}.value{font-size:32px;color:#deba79}progress{width:100%;height:14px;accent-color:#deba79}a{color:#deba79}#error{color:#eea9a0}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{margin:5px 0}main{padding:18px}}</style>
<main><small>公开进度 · 只读 · 每 3 秒更新</small><h1>人道无极 · 实时制作进度</h1><h2 id="chapter">正在连接…</h2><p id="status"></p><p id="error"></p><div class="grid"><div class="card">本章镜头已生成<div class="value" id="count">—</div></div><div class="card">已审片通过<div class="value" id="approved">—</div></div><div class="card">当前采样<div class="value" id="steps">—</div></div></div><progress id="bar" max="1" value="0"></progress><p class="muted"><span id="resolution">正在读取分辨率</span> · <span id="engine">正在读取模型</span> · 已生成的镜头仍需审片，完成后合成章节及最新全量视频。</p><section class="card"><h2>资源状态</h2><p id="resources">等待资源采样</p><small id="sampleTime"></small></section><section class="card"><h2>最近镜头</h2><div id="recent"></div></section><small id="updated"></small></main>
<script>
const $=id=>document.getElementById(id);const states={submitted:'生成中',submitting:'正在提交',rendered:'待审片',approved:'已验收',rejected:'需重拍',failed:'生成失败',canceled:'已停止'};let busy=false;
async function refresh(){if(busy)return;busy=true;try{const response=await fetch('/api/progress',{cache:'no-store'});if(!response.ok)throw Error('连接暂时中断，正在重试');const p=await response.json();$('error').textContent='';$('resolution').textContent=p.resolution_label||'正在读取分辨率';const engine=p.video_engine||{};$('engine').textContent=engine.name?engine.name+' · '+(engine.steps||p.steps_total||'—')+' 步':'正在读取模型';$('chapter').textContent=p.chapter;$('status').textContent=p.paused?'任务已暂停':p.active?'正在生成 '+p.active.shot:'当前没有正在生成的镜头';$('count').textContent=p.completed+' / '+p.total;$('approved').textContent=p.approved;$('steps').textContent=p.active?(p.steps===null?(p.stage||'准备采样'):p.steps+' / '+(p.steps_total||8)):'—';$('bar').max=p.total||1;$('bar').value=p.completed;if(p.resources){const r=p.resources;$('resources').textContent=`显卡 ${(r.gpu_mib/1024).toFixed(1)} GiB · 温度 ${r.temperature_c??r.gpu_temp}°C · 功耗 ${(r.power_w??r.gpu_watts).toFixed(0)} W · 模型内存 ${(r.model_memory_gib??r.models_gib).toFixed(1)} / 44 GiB · 系统可用 ${r.available_gib.toFixed(1)} GiB`;$('sampleTime').textContent=(p.updated_at-r.time>20?'历史采样 · ':'')+new Date(r.time*1000).toLocaleString()};$('recent').replaceChildren();for(const item of p.recent){const row=document.createElement('p');row.textContent=item.shot+' · '+(states[item.status]||item.status)+(item.speech_exception?' · 转写核对失败·已保留':'')+' ';if(item.video_url){const a=document.createElement('a');a.textContent='查看视频';a.href=item.video_url;a.target='_blank';a.rel='noopener';row.append(a)}$('recent').append(row)}$('updated').textContent='每 3 秒刷新 · 最近更新 '+new Date(p.updated_at*1000).toLocaleString()}catch(e){$('error').textContent=e.message}finally{busy=false}}refresh();setInterval(refresh,3000);
</script></html>
