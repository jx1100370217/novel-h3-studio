name: novel-cinematic
version: "1.0"
description: >
  Faithful novel-to-film pipeline for long-form Chinese fiction. The source is a
  full novel (or chapter) plus a previously approved character/scene reference
  set; each shot is authored as a continuous photorealistic period-drama take
  and rendered locally with the MiniMax H3 / VDN-H3 Turbo stack before a
  continuity-aware edit and subtitle burn.
category: cinematic
stability: beta
default_checkpoint_policy: guided

orchestration:
  mode: executive-producer
  skill: pipelines/novel-cinematic/executive-producer
  budget_default_usd: 0.00
  max_revisions_per_stage: 3

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/novel-cinematic/executive-producer
  - pipelines/novel-cinematic/novel-director
  - pipelines/novel-cinematic/screenplay-director
  - pipelines/novel-cinematic/scene-director
  - pipelines/novel-cinematic/asset-director
  - pipelines/novel-cinematic/edit-director
  - pipelines/novel-cinematic/compose-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  recommended:
    - clean-professional
  also_works:
    - flat-motion-graphics
  custom_allowed: true

stages:
  - name: breakdown
    skill: pipelines/novel-cinematic/novel-director
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every adapted section cites its source paragraph ids
      - No invented facts, names, dialogue or endings
      - Section text covers the dramatic action, not just summary
    success_criteria:
      - Schema-valid script artifact
      - total_duration_seconds reflects the story's needs; the planned runtime is a soft estimate, not a hard cap

  - name: screenplay
    skill: pipelines/novel-cinematic/screenplay-director
    required_artifacts_in:
      - script
    produces:
      - screenplay_treatment
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every scene records want / obstacle / turn / coverage; no two consecutive scenes do the same job
      - The opening 15 seconds pose a question (metadata.opening_hook); motifs change at least three times
      - Dialogue carries the story; narration is absent or only for an unwitnessable time jump
      - Every new line is declared in added_dialogue with a source fact and a dramatic purpose
      - Scenes are 8–14 dramatic units with a want, obstacle and turn, not one-line beats
      - Added visual beats are not new plot; connective dialogue is allowed when declared
      - No new characters, locations, plot events or changed ending
    success_criteria:
      - Schema-valid screenplay_treatment artifact
      - Enhanced script is scene-based and dialogue-first; source facts are preserved
      - scripts/audit_screenplay.py reports pass with zero undeclared lines
      - Runtime follows the story; no hard cap

  - name: scene_plan
    skill: pipelines/novel-cinematic/scene-director
    required_artifacts_in:
      - script
      - screenplay_treatment
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every screenplay scene is split into 3–12 H3 shots (typically 3–7); every take is capped at 328 frames with ≤3 visual references and 260 frames with 4+
      - Each shot has exact frames on the 17n+5 grid, camera, lens, movement, lighting, blocking, dialogue, continuity and H3 notes
      - Shot coverage answers the dramatic question and the scene turn
      - Screen direction and axis stay coherent across shots
    success_criteria:
      - Schema-valid scene_plan artifact
      - Every screenplay scene maps to 3–12 shots (typically 3–7), each take ≤328 frames with ≤3 visual references (≤260 with 4+)
      - Every shot has a project-local contract with legal frames and dialogue

  - name: assets
    skill: pipelines/novel-cinematic/asset-director
    required_artifacts_in:
      - scene_plan
    optional_artifacts_in:
      - script
    produces:
      - asset_manifest
    required_tools:
      - fastvideo_h3_video
    optional_tools:
      - vdn_h3_video
      - codex_image
      - image_selector
    tools_available:
      - fastvideo_h3_video
      - vdn_h3_video
      - blender_previs
      - codex_image
      - image_selector
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Approved reference images are reused, not silently regenerated
      - One continuous take per shot with native H3 dialogue and sound effects, correct duration
      - Cast count, identity and costume stay consistent with references
      - Every speaking character has a dedicated voice reference; no text-only speaker guessing
      - "`<Audio N>` follows the request's voices order and binds `<Subject N>` for every visible speaker; `novel_h3.spec_audit` passes before any render"
      - Every multi-person shot uses a Blender blocking guide with the exact authored body count
      - Strict six-section Ref2VA prompts pass the official validator
    success_criteria:
      - Schema-valid asset_manifest artifact
      - Every referenced clip exists and passes ffprobe
      - Every rendered spec passes `novel_h3.spec_audit`; no take is rendered with swapped voices

  - name: edit
    skill: pipelines/novel-cinematic/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    optional_artifacts_in:
      - script
    produces:
      - edit_decisions
    required_tools:
      - transition_audit
    tools_available:
      - transition_audit
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Cuts follow the authored shot durations and ordering
      - Every cut is checked on its actual last/first frame by transition_audit
      - Every needs_fix cut has a handoff, edit fix or recorded human acceptance
      - Typography cue windows sit inside the correct shot
    success_criteria:
      - Schema-valid edit_decisions artifact
      - Edit decisions cover the full planned runtime

  - name: compose
    skill: pipelines/novel-cinematic/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    optional_artifacts_in:
      - scene_plan
    produces:
      - render_report
      - final_review
    required_tools:
      - video_stitch
      - video_compose
      - audio_mixer
      - audio_qc
    optional_tools:
      - color_grade
    tools_available:
      - video_stitch
      - video_compose
      - audio_mixer
      - audio_qc
      - color_grade
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Native H3 character dialogue and sound effects survive the assembly
      - Narration TTS and music are mixed underneath the native take audio
      - "Subtitle cues are word-aligned to the spoken line; no cue starts after its first word or ends before its last"
      - "Every chapter's subtitle_qc report is clean: no frame carries two caption rows"
      - "`novel_h3.voice_audit` is pass or every review line is re-listened to and recorded"
      - The audio_qc report is pass or every issue is explicitly resolved
      - Output is H.264/AAC at 1344x768 / 24fps
    success_criteria:
      - Schema-valid render_report artifact
      - Output file exists and passes ffprobe validation
      - audio_qc report exists and is pass or human-approved
      - "`v3/chapters/<chapter>/subtitle_qc.json` is clean, or every duplicate frame is explicitly resolved"
      - "`voice_audit.json` is pass, or every review line has a recorded human re-listen"

  - name: publish
    skill: pipelines/novel-cinematic/publish-director
    required_artifacts_in:
      - render_report
      - final_review
    optional_artifacts_in:
      - script
    produces:
      - publish_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Metadata matches the source chapter and adaptation scope
      - The human audio review warning is surfaced, not hidden
    success_criteria:
      - Schema-valid publish_log artifact
      - Export package contains video, subtitle and metadata outputs
